name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Verify project
        run: |
          test -f KurtDhylanMotoShopInventory.csproj
          dotnet --info
          echo "Project found."

      - name: Restore
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Publish Android APK
        run: |
          dotnet publish KurtDhylanMotoShopInventory.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory-APK
          path: "**/bin/Release/net10.0-android/**/*.apk"
          if-no-files-found: error
